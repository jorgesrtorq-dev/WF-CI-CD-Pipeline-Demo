!!ExportedWorkflow
apiVersion: torq.io/v2alpha
kind: Workflow
id: 07d51fd8-d48c-4b4d-8989-72029220c798
name: test for okta
trigger:
  onDemandTrigger:
    parameterList:
      parameters: []
playbook:
  steps:
    - name: us-docker.pkg.dev/stackpulse/public/scripting/python:3.8.0
      id: run_a_python_script
      env:
        PYTHON_CODE: |
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.backends import default_backend
          import base64
          import json
          import uuid

          # Generate RSA-2048 private key
          private_key = rsa.generate_private_key(
              public_exponent=65537,
              key_size=2048,
              backend=default_backend()
          )

          # Export private key as PEM — goes to Torq Secrets
          private_pem = private_key.private_bytes(
              encoding=serialization.Encoding.PEM,
              format=serialization.PrivateFormat.PKCS8,
              encryption_algorithm=serialization.NoEncryption()
          ).decode("utf-8")

          # Build public key JWK — goes to Okta Admin Console
          pub_numbers = private_key.public_key().public_numbers()

          def to_base64url(n):
              length = (n.bit_length() + 7) // 8
              return base64.urlsafe_b64encode(
                  n.to_bytes(length, byteorder="big")
              ).rstrip(b"=").decode("utf-8")

          kid = f"torq-prod-{str(uuid.uuid4())[:8]}"  # e.g. torq-prod-a1b2c3d4

          public_jwk = {
              "kty": "RSA",
              "use": "sig",
              "alg": "RS256",
              "kid": kid,
              "n": to_base64url(pub_numbers.n),
              "e": to_base64url(pub_numbers.e)
          }

          result = {
              "private_key_pem": private_pem,
              "public_jwk": json.dumps(public_jwk, indent=2),
              "kid": kid
          }

          print(json.dumps(result, indent=2))
      uuid: c139417b-92f5-4a9e-9a3b-df7587889a84
